<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="icon" type="image/png" href="/static/favicon.png">
  <title>{{ who.role }} sign in · School ID</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="login-body">
  <main class="login-card">
    <img class="brand-logo" src="/static/pgpc-logo.png" alt="Padre Garcia Polytechnic College seal" width="42" height="42">
    <p class="eyebrow">{{ who.eyebrow }}</p>
    <h1>Sign in</h1>
    {% if not configured %}
    <p class="notice error" role="alert">Sign-in is not set up on this server yet. Set {{ who.variable }} in the environment variables and redeploy.</p>
    {% elif error %}
    <p class="notice error" role="alert">{{ error }}</p>
    {% endif %}
    <form method="post" action="{{ who.action }}" autocomplete="on">
      <label>Username<input name="username" autocomplete="username" required autofocus></label>
      <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
      <button type="submit" class="primary"{% if not configured %} disabled{% endif %}>Sign in</button>
    </form>
    <p class="subtle"><a href="/">Choose another role</a></p>
  </main>
</body>
</html>
