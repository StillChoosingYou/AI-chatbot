<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>School ID · Sign in</title><link rel="stylesheet" href="{{asset_url('style.css')}}"></head>
<body class="profile-body"><main class="login-panel"><h1>School ID assistant</h1><p>Sign in as a student, property management coordinator, or guard using your assigned account.</p><form method="post"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><label>Username<input name="username" autocomplete="username" maxlength="100" required></label><label>Student number (students only)<input name="student_id" autocomplete="off" maxlength="100"></label><label>Password<input type="password" name="password" autocomplete="current-password" required></label><p role="alert">{{error}}</p><button class="primary">Sign in</button></form><p class="subtle">Need an account? Contact the property management coordinator.</p><p><a href="/help">Public ID help—no login needed</a></p><strong>No ID, No Entry.</strong></main></body></html>
