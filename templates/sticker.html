<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QR sticker · {{student.student_id}}</title><style>body{font:14px system-ui;text-align:center;background:#f4f6f5}main{margin:50px auto} .sticker{display:inline-flex;flex-direction:column;align-items:center;padding:2mm;background:white;border:1px dashed #999}img{width:30mm;height:30mm}small{font-size:8pt}button{padding:12px;margin:20px} @media print{@page{margin:10mm}body{background:white}main{margin:0}.controls{display:none}.sticker{border:none}}</style></head><body><main><div class="controls"><h1>Print QR sticker</h1><p>Print at actual size (100%). QR area: 30 × 30 mm.</p><p>Scan to check the student’s name and year &amp; section.</p><button onclick="window.print()">Print sticker</button><p><a href="{{scan_url}}">Open scan result</a> · <a href="{{qr_src}}" download="school-id-{{student.student_id}}.png">Download QR</a></p>{% if not mine %}<p>Use a reachable PUBLIC_BASE_URL before printing for phones.</p>{% endif %}</div><div class="sticker"><img src="{{qr_src}}" alt="QR code for {{student.student_id}}"><small>{{student.student_id}}</small></div></main></body></html>
