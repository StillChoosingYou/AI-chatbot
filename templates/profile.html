<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="icon" type="image/png" href="/static/favicon.png">
  <title>Student ID details</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="profile-body">
  <main class="profile-card">
    <img class="brand-logo" src="/static/pgpc-logo.png" alt="Padre Garcia Polytechnic College seal" width="42" height="42">
    <p class="eyebrow">SCHOOL ID · STUDENT DETAILS</p>
    <h1>{{student.name}}</h1>
    <dl>
      <dt>Year &amp; Section</dt><dd>{{student.year_section}}</dd>
    </dl>
    <p class="subtle">School Property Management · Sample record. Guards can use this scan at the gate; it does not replace a physical ID.</p>
  </main>
</body>
</html>
