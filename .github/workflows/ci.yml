# Runs on every pull request and every push to main: lint, retrain (so the model matches this Python/scikit-learn),
# then the whole test suite against a real PostgreSQL. The tests use their own throw-away schema.
name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: school_test
          POSTGRES_PASSWORD: school_test
          POSTGRES_DB: school_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U school_test -d school_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://school_test:school_test@127.0.0.1:5432/school_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: pip install -r requirements.txt pyflakes
      - name: Lint (Python)
        run: python -m pyflakes *.py tests/*.py
      - name: Lint (JavaScript syntax)
        run: for f in static/*.js; do node --check "$f"; done
      - name: Train the model for this environment
        run: python train_model.py
      - name: Tests
        run: python -m unittest discover -s tests
